<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#163b3d">
    <meta name="robots" content="noindex">
    <title>Page not found — Awesome Study Tools</title>
    <link id="favicon" rel="icon" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --paper: #f5f2e9;
        --surface: #fffdf8;
        --ink: #132d31;
        --soft: #53696a;
        --teal: #163b3d;
        --teal-mid: #285b59;
        --gold: #c6924a;
        --line: #d8d7cc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 15%, rgba(198, 146, 74, 0.13), transparent 28rem),
          linear-gradient(150deg, var(--paper), #eef1ea);
      }

      main {
        width: min(calc(100% - 2rem), 760px);
        padding: clamp(1.5rem, 5vw, 3.5rem);
        background: rgba(255, 253, 248, 0.96);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(22, 59, 61, 0.11);
      }

      .brand {
        display: inline-flex;
        gap: 0.65rem;
        align-items: center;
        color: var(--teal);
        font-size: 0.86rem;
        font-weight: 780;
        letter-spacing: 0.02em;
      }

      .book {
        display: flex;
        gap: 2px;
        width: 25px;
        height: 21px;
        padding: 4px 3px 3px;
        background: var(--teal);
        border-radius: 6px;
      }

      .book span {
        width: 50%;
        background: var(--paper);
        border-radius: 1px 4px 2px 1px;
        transform: skewY(6deg);
      }

      .book span:last-child {
        border-radius: 4px 1px 1px 2px;
        transform: skewY(-6deg);
      }

      .rule {
        width: 4.5rem;
        height: 3px;
        margin: clamp(2rem, 6vw, 4rem) 0 1.4rem;
        background: var(--gold);
      }

      .code {
        margin: 0;
        color: var(--teal-mid);
        font-size: 0.72rem;
        font-weight: 820;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 620px;
        margin: 0.4rem 0 1rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 9vw, 5rem);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 0.98;
      }

      p {
        max-width: 540px;
        margin: 0;
        color: var(--soft);
        line-height: 1.6;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 45px;
        padding: 0.65rem 1rem;
        margin-top: 1.6rem;
        color: white;
        background: var(--teal);
        border-radius: 9px;
        font-size: 0.84rem;
        font-weight: 760;
        text-decoration: none;
      }

      .button:hover {
        background: var(--teal-mid);
      }

      :focus-visible {
        outline: 3px solid rgba(198, 146, 74, 0.9);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="book" aria-hidden="true"><span></span><span></span></span>
        <span>Awesome Study Tools</span>
      </div>
      <div class="rule" aria-hidden="true"></div>
      <p class="code">Error 404</p>
      <h1>This page isn’t in the catalogue.</h1>
      <p>
        The address may have changed, or the page may no longer exist. Return to the
        directory to keep exploring study tools.
      </p>
      <a id="home-link" class="button" href="./">Return to the catalogue</a>
    </main>

    <script>
      (() => {
        const segments = window.location.pathname.split("/").filter(Boolean);
        const onGitHubPages = window.location.hostname.endsWith("github.io");
        const base = onGitHubPages && segments.length
          ? `/${encodeURIComponent(segments[0])}/`
          : "/";
        document.querySelector("#home-link").href = base;
        document.querySelector("#favicon").href = `${base}favicon.svg`;
      })();
    </script>
  </body>
</html>
